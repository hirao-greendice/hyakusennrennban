<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clubnumber009</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="page">
        <section class="title-banner" aria-label="BGM title">
            <p class="title-banner__text" id="title-text">このレコードは、あるものを表している。<br>レコード中央の一点が示す、ひらがな7文字が答え</p>
        </section>

        <section class="content-panel" aria-label="Main content area">
            <div class="content-panel__frame">
                <div class="player-stage" data-player-state="stopped">
                    <div class="player-stage__visuals" aria-hidden="true">
                        <div class="player-stage__domain-marker">
                            <span class="player-stage__domain-text"></span>
                            <img class="player-stage__triangle" src="./assets/img/triangle.png" alt="">
                        </div>
                        <img class="player-stage__case" src="./assets/img/case.png" alt="">
                        <div class="player-stage__record-stack">
                            <img class="player-stage__record" src="./assets/img/recode.png" alt="">
                            <img class="player-stage__hint" src="./assets/img/hint1.png" alt="">
                            <img class="player-stage__logo" src="./assets/img/logo.png" alt="">
                        </div>
                    </div>

                    <div class="player-controls">
                        <input
                            class="player-seek"
                            type="range"
                            min="0"
                            max="1000"
                            step="1"
                            value="0"
                            aria-label="Playback position"
                        >
                        <div class="player-time-wrap">
                            <div class="player-time" aria-live="polite">0:00 / 24:00</div>
                        </div>
                    </div>

                    <button class="player-toggle" type="button" aria-pressed="false">再生する</button>
                </div>
            </div>
        </section>

        <div class="puzzle-grid">
            <section class="puzzle-section" data-puzzle-id="1" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">1問目</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-1"
                    placeholder="答えを入力"
                    aria-label="Answer input 1"
                >
                <button class="puzzle-section__button" type="button">送信</button>
            </section>

            <section class="puzzle-section" data-puzzle-id="2" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">2問目</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-2"
                    placeholder="答えを入力"
                    aria-label="Answer input 2"
                >
                <button class="puzzle-section__button" type="button">送信</button>
            </section>

            <section class="puzzle-section" data-puzzle-id="3" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">3問目</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-3"
                    placeholder="答えを入力"
                    aria-label="Answer input 3"
                >
                <button class="puzzle-section__button" type="button">送信</button>
            </section>

            <section class="puzzle-section" data-puzzle-id="4" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">4問目</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-4"
                    placeholder="答えを入力"
                    aria-label="Answer input 4"
                >
                <button class="puzzle-section__button" type="button">送信</button>
            </section>
        </div>
    </main>

    <audio id="bg-music" src="./assets/audio/music.mp3" preload="auto" loop></audio>
    <script src="./script.js"></script>
</body>
</html>
