<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Puzzle</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="page">
        <section class="title-banner" aria-label="BGM title">
            <p class="title-banner__text">&#x6B8B;&#x308A;10&#x5206;BGM</p>
        </section>
        <section class="content-panel" aria-label="Main content area"></section>
        <div class="puzzle-grid">
            <section class="puzzle-section" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">1&#x554F;&#x76EE;</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer"
                    placeholder="&#x7B54;&#x3048;&#x3092;&#x5165;&#x529B;"
                    aria-label="Answer input"
                >
                <button class="puzzle-section__button" type="button">&#x9001;&#x4FE1;</button>
            </section>
            <section class="puzzle-section" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">2&#x554F;&#x76EE;</div>
                <div class="puzzle-section__frame">

                </div>

                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-2"
                    placeholder="&#x7B54;&#x3048;&#x3092;&#x5165;&#x529B;"
                    aria-label="Answer input"
                >
                <button class="puzzle-section__button" type="button">&#x9001;&#x4FE1;</button>
            </section>
            <section class="puzzle-section" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">3&#x554F;&#x76EE;</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-3"
                    placeholder="&#x7B54;&#x3048;&#x3092;&#x5165;&#x529B;"
                    aria-label="Answer input"
                >
                <button class="puzzle-section__button" type="button">&#x9001;&#x4FE1;</button>
            </section>
            <section class="puzzle-section" aria-label="Puzzle answer area">
                <div class="puzzle-section__tab">4&#x554F;&#x76EE;</div>
                <div class="puzzle-section__frame">
                    <div class="puzzle-section__canvas"></div>
                </div>
                <input
                    class="puzzle-section__input"
                    type="text"
                    name="puzzle-answer-4"
                    placeholder="&#x7B54;&#x3048;&#x3092;&#x5165;&#x529B;"
                    aria-label="Answer input"
                >
                <button class="puzzle-section__button" type="button">&#x9001;&#x4FE1;</button>
            </section>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
